<!-- ============================================================
     HEADER COMPONENT
     ============================================================ -->
<header class="header" id="mainHeader">
  <div class="header__inner">

    <!-- Logo -->
    <a href="#" class="header__logo" aria-label="Isabeleé Parfums — Inicio">
      <img src="assets/logos/isabelee-logo.png"
           alt="Isabeleé Parfums"
           onerror="this.onerror=null;this.src='../ChatGPT Image 9 may 2026, 06_04_21 p.m..png'">
    </a>

    <!-- Desktop nav -->
    <nav class="header__nav" aria-label="Navegación principal">
      <ul class="nav__list">
        <li class="nav__item"><a href="#">Inicio</a></li>
        <li class="nav__item"><a href="#hombre">Hombre</a></li>
        <li class="nav__item"><a href="#mujer">Mujer</a></li>
        <li class="nav__item"><a href="#productos">Catálogo</a></li>
        <li class="nav__item"><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>

    <!-- Desktop search form -->
    <form class="header__search" id="searchForm" role="search" autocomplete="off"
          aria-label="Buscar perfumes">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="search" id="searchInput" class="search-input"
               placeholder="Buscar fragancia, marca…"
               aria-label="Buscar fragancia"
               autocomplete="off">
        <button type="button" class="search-clear" id="searchClear"
                aria-label="Limpiar búsqueda" style="display:none">
          <svg viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </form>

    <!-- Actions -->
    <div class="header__actions">

      <!-- Mobile search toggle -->
      <button class="icon-btn" id="mobileSearchBtn" aria-label="Buscar">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35"/>
        </svg>
      </button>

      <!-- Cart -->
      <button class="icon-btn" id="cartBtn" aria-label="Abrir carrito">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span class="cart-badge" aria-live="polite">0</span>
      </button>

      <!-- Hamburger -->
      <button class="hamburger" id="hamburger"
              aria-label="Menú de navegación" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

  </div>
</header>

<!-- Mobile menu (rendered right after header) -->
<div class="mob-menu" id="mobMenu" role="navigation" aria-label="Menú móvil">
  <ul class="mob-menu__list">
    <li class="mob-menu__item"><a href="#">Inicio</a></li>
    <li class="mob-menu__item"><a href="#hombre">Hombre</a></li>
    <li class="mob-menu__item"><a href="#mujer">Mujer</a></li>
    <li class="mob-menu__item"><a href="#productos">Catálogo</a></li>
    <li class="mob-menu__item"><a href="#contacto">Contacto</a></li>
  </ul>
</div>
