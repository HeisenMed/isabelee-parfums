<!-- ============================================================
     NEWSLETTER COMPONENT
     ============================================================ -->
<section class="section section--beige" id="contacto" aria-labelledby="nl-title">
  <div class="wrap">
    <div class="nl__inner">

      <div class="nl__icon reveal" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8
               M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
      </div>

      <h2 class="nl__title reveal" id="nl-title">
        Únete a la Experiencia<br>Isabeleé
      </h2>

      <p class="nl__subtitle reveal">
        Sé el primero en conocer nuestras nuevas fragancias,
        ofertas exclusivas y eventos especiales.
      </p>

      <form class="nl__form reveal" novalidate>
        <input
          class="nl__input"
          type="email"
          name="email"
          placeholder="Tu correo electrónico"
          required
          autocomplete="email"
          aria-label="Correo electrónico">
        <button type="submit" class="nl__submit">Suscribirse</button>
      </form>

    </div>
  </div>
</section>
